
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Vedanshi 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#ffe0ed,#fce7f3,#eadcff);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
  color: #75435e;
}

.heart {
  position: fixed;
  bottom: -30px;
  animation: float 7s linear infinite;
  pointer-events: none;
  opacity: .65;
}

@keyframes float {
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

.card {
  width: 100%;
  max-width: 410px;
  background: rgba(255,255,255,.88);
  padding: 30px 22px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 15px 50px #bd79a644;
  border: 2px solid white;
  position: relative;
  z-index: 2;
}

.bow { font-size: 38px; }

h1 {
  color: #d65391;
  font-size: 29px;
}

h2 { color: #d65391; }

p {
  line-height: 1.8;
  font-size: 15px;
}

button {
  background: #e878aa;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 13px 24px;
  font-size: 15px;
  margin: 8px;
  cursor: pointer;
  box-shadow: 0 5px 15px #e878aa44;
}

button:active { transform: scale(.96); }

#letter { display: none; }

#final { display: none; }

.divider {
  color: #e99abc;
  letter-spacing: 5px;
  margin: 20px 0;
}

.small {
  font-size: 11px;
  color: #b88ba5;
}

</style>
</head>

<body>

<div class="card">

<div class="bow">🎀</div>

<div style="font-size:48px">💗</div>

<h1>Hey Janki!</h1>

<p>
A special notification has arrived
from someone who has a suprise 
gift for you......
</p>

<div class="divider">♡ ♡ ♡</div>



<button onclick="openLetter()">
Open your little surprise 💌
</button>

<div id="letter" style="display:none; margin-top:20px;">

    <h3>Just for you, Janki ❤️</h3>

    <video
        id="surpriseVideo"
        controls
        playsinline
        preload="metadata"
        style="width:100%; max-width:320px; border-radius:18px;">

        <source src="surprise.mp4" type="video/mp4">

        Your browser does not support video.
    </video>

</div>

<div class="divider">🌷 ✨ 🌷</div>


</div>

<div class="divider">♡ made with love ♡</div>

<p class="small">
Designed by your non favourite person👨‍🎓
</p>

</div>

<script>
function openLetter() {
    document.getElementById("letter").style.display = "block";

    const video = document.getElementById("surpriseVideo");
    video.play();
}
function showFinal() {
  document.getElementById("final").style.display = "block";
}

const emojis = ["💗","💕","🌸","✨","🎀"];

setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (15+Math.random()*20)+"px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(),7000);
},500);
</script>

</body>
</html>
